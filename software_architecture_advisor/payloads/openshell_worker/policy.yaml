version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  opencode_zen:
    name: opencode-zen-model-api
    endpoints:
      - host: opencode.ai
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: POST, path: /zen/v1/responses}
          - allow: {method: GET, path: /zen/v1/models}
    binaries:
      - {path: /usr/local/bin/opencode}
  local_spark:
    name: local-spark-model-api
    endpoints:
      - host: 10.0.4.32
        port: 8000
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: POST, path: /v1/chat/completions}
    binaries:
      - {path: /usr/local/bin/opencode}
# The image includes its model cache. No package registries, arbitrary websites,
# or host directories are available to the coding process at runtime.
