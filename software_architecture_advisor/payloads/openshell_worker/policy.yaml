version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  mini_model_gateway:
    name: mini-model-gateway
    endpoints:
      - host: ${config.opencode.gateway_hosts.mini}
        port: 4000
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: POST, path: /v1/chat/completions}
    binaries:
      - {path: /usr/local/bin/opencode}
  spark_model_gateway:
    name: spark-model-gateway
    endpoints:
      - host: ${config.opencode.gateway_hosts.spark}
        port: 4000
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: POST, path: /v1/chat/completions}
    binaries:
      - {path: /usr/local/bin/opencode}
# The image includes its model cache. No package registries, arbitrary websites,
# or host directories are available to the coding process at runtime.
