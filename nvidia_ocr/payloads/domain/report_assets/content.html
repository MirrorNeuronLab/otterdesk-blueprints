<section id="comparison-view">
  <div class="comparison-toolbar">
    <label class="file-control"
      >Document<select id="document-select" aria-label="Document"></select
    ></label>
    <div class="page-controls">
      <button id="previous-page" aria-label="Previous page">Previous</button
      ><label>Page<select id="page-select" aria-label="Page"></select></label
      ><button id="next-page" aria-label="Next page">Next</button>
    </div>
  </div>
  <p id="document-note" class="qualification"></p>
  <div id="document-error" class="workspace-alert" role="status" hidden></div>
  <div class="comparison-grid">
    <section class="comparison-pane" aria-labelledby="original-heading">
      <div class="pane-heading">
        <h2 id="original-heading">Original</h2>
        <a id="original-link" download>Download original</a>
      </div>
      <div class="preview-tools">
        <label
          >Zoom<select id="zoom" aria-label="Preview zoom">
            <option value="100">Fit width</option>
            <option value="150">150%</option>
            <option value="200">200%</option>
          </select></label
        ><label class="inline-control"
          ><input id="show-regions" type="checkbox" /> Show text regions</label
        >
      </div>
      <div
        id="preview-scroll"
        class="preview-scroll"
        tabindex="0"
        aria-label="Original page preview"
      >
        <svg
          id="page-preview"
          role="group"
          aria-label="Original page"
          data-zoom="100"
        ></svg>
        <p id="preview-empty" class="empty-state" hidden>
          Preview unavailable. Download the original file.
        </p>
      </div>
    </section>
    <section class="comparison-pane" aria-labelledby="ocr-heading">
      <div class="pane-heading">
        <h2 id="ocr-heading">OCR result</h2>
        <button id="copy-text">Copy page text</button>
      </div>
      <div class="result-tools">
        <span id="page-stats" class="qualification"></span
        ><label
          >View<select id="result-view" aria-label="Result view">
            <option value="text">Text</option>
            <option value="regions">Regions</option>
          </select></label
        >
      </div>
      <div
        class="result-scroll"
        id="result-scroll"
        tabindex="0"
        aria-label="Extracted page text"
      >
        <div id="page-text"></div>
        <div id="region-list" hidden></div>
        <p id="text-empty" class="empty-state" hidden>
          No text was detected on this page.
        </p>
      </div>
    </section>
  </div>
  <p
    id="copy-status"
    class="qualification"
    role="status"
    aria-live="polite"
  ></p>
  <p class="report-footer">
    OCR may misread or omit text. Compare important details with the original.
  </p>
</section>
<section id="files-view" hidden>
  <h2>Files in this run</h2>
  <p id="batch-counts"></p>
  <label
    >Find a file<input
      id="file-search"
      type="search"
      placeholder="Filter by name"
      aria-label="Find a file"
  /></label>
  <div id="file-list"></div>
  <p id="file-empty" class="empty-state" hidden>No matching files.</p>
</section>
