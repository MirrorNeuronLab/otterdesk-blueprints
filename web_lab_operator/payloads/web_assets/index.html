<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web lab</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <section aria-label="Simulated deck" class="deck-panel">
      <iframe id="visualizer" title="PyLabRobot visualizer" src="visualizer/index.html"></iframe>
      <div id="deck" hidden></div>
      <output id="well-detail" role="status" hidden></output>
    </section>
    <section id="replay" hidden aria-label="Replay controls">
      <button id="previous" type="button">Previous</button><button id="play" type="button">Play</button>
      <input id="frame" aria-label="Observation" type="range" min="0" value="0"><output id="position" for="frame"></output>
      <button id="next" type="button">Next</button>
    </section>
    <section class="activity" aria-label="Event stream">
      <div class="identity"><h2>Events</h2><div class="state"><span id="status" role="status">Connecting</span><span id="progress"></span></div></div>
      <div id="operation" role="status" hidden><span id="current-step" class="step"></span><span id="operation-label"></span></div>
      <ol id="events"></ol>
      <p id="empty">Waiting for the simulation.</p>
      <p id="reason" role="status" hidden></p>
      <p id="connection" role="alert" hidden>Connection lost. Reconnecting…</p>
    </section>
  </main>
</body>
</html>
